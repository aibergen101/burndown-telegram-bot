name: Deploy .NET apps into non-production VPS

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: uat

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Run unit tests
        run: dotnet test
      
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_IMAGE_NAME }} -f YouTrackData/Dockerfile .
          docker push ${{ secrets.DOCKER_IMAGE_NAME }}

      - name: Deploy to VPS
        # Сторонний action с ветки master получает SSH-ключ и секреты - нужно закрепить на версии, а лучше на SHA коммита
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Токен с правами на push остаётся на VPS в ~/.docker/config.json - для pull на сервере нужен отдельный read-only токен
            docker login -u ${{ secrets.DOCKER_HUB_USERNAME }} --password-stdin <<< "${{ secrets.DOCKER_HUB_TOKEN }}"
            docker pull ${{ secrets.DOCKER_IMAGE_NAME }}
            docker stop be || true
            docker rm be || true
            # -p 8080:8080 не нужен: приложение консольное, бот на long polling, на 8080 никто не слушает. И имя контейнера be ни о чём - лучше burndown-bot
            # Логи без ротации (--log-opt max-size=10m --log-opt max-file=3) и старые образы не чистятся (docker image prune -f) - со временем закончится место на диске
            docker run -d \
              --name be \
              --restart unless-stopped \
              -p 8080:8080 \
              -e YouTrackToken="${{secrets.YOUTRACK_TOKEN}}" \
              -e TelegramToken="${{secrets.TELEGRAM_TOKEN}}" \
              -e ChatId="${{secrets.CHAT_ID}}" \
              -e AllowedUserIds="${{vars.ALLOWED_USER_IDS}}" \
              ${{ secrets.DOCKER_IMAGE_NAME }}
